# ---------------------------------------------------------------------------
# nginx para la SPA: fallback a index.html (React Router) + proxy /api a la API.
# ---------------------------------------------------------------------------
upstream boda_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Archivos con hash en el nombre: caché agresiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El HTML nunca se cachea: así una boda nueva se ve al instante.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # La API vive en el mismo origen: sin problemas de CORS ni de cookies.
  location /api/ {
    proxy_pass http://boda_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  # Fallback de SPA: /admin/weddings/abc y /i/vanessa/token caen en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
